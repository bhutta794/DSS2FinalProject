services:
  postgres:
    image: postgres:15
    container_name: todo-postgres
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: todo-api
    ports:
      - "3087:3087"
    environment:
      - ASPNETCORE_URLS=http://+:3087
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=todo_db;Username=postgres;Password=postgres
      - Jwt__Key=my-very-secret-key-that-is-at-least-32-characters-long
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: